<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 400;
        src: url("fonts/be-vietnam-pro-vietnamese-400-normal.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 400;
        src: url("fonts/be-vietnam-pro-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 800;
        src: url("fonts/be-vietnam-pro-vietnamese-800-normal.woff2") format("woff2");
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        font-weight: 800;
        src: url("fonts/be-vietnam-pro-latin-800-normal.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0a1a; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: -10%;
        background: radial-gradient(circle at 30% 40%, #5b21b6 0%, transparent 55%),
          radial-gradient(circle at 75% 65%, #ea580c 0%, transparent 50%), #0b0a1a;
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #title {
        color: #ffffff;
        font-size: 132px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #sub {
        color: #fde68a;
        font-size: 48px;
        font-weight: 400;
      }
      #bar {
        width: 240px;
        height: 8px;
        border-radius: 4px;
        background: #f97316;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="bg-clip" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="bg"></div>
      </div>
      <div id="text-clip" class="clip center" data-start="0" data-duration="6" data-track-index="1">
        <h1 id="title">Xin chào các bạn!</h1>
        <div id="bar"></div>
        <p id="sub">Video đầu tiên làm bằng Claude Code &amp; Hyperframes</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { scale: 1, rotation: 0 }, { scale: 1.15, rotation: 4, duration: 6, ease: "none" }, 0);
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 0.3);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 1.1);
      tl.fromTo("#sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.5);
      tl.to(["#title", "#bar", "#sub"], { opacity: 0, y: -30, duration: 0.6, stagger: 0.08, ease: "power2.in" }, 5.1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
